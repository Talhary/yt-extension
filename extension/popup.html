<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root {
    --bg: #ffffff; --card: #f2f2f2; --hover: #e5e5e5; --line: #e5e5e5; --text: #0f0f0f; --muted: #606060;
    --accent: #ff0033; --ok: #2ba640; --err: #cc0000;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0f0f; --card: #1f1f1f; --hover: #2e2e2e; --line: #262626; --text: #f1f1f1; --muted: #aaa; }
  }
  * { box-sizing: border-box; }
  body {
    width: 380px; margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.4 "Segoe UI", Roboto, system-ui, sans-serif;
  }
  svg { fill: currentColor; flex: none; }
  header { display: flex; align-items: center; gap: 10px; padding: 16px; border-bottom: 1px solid var(--line); }
  .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; color: #fff; }
  .logo svg { width: 20px; height: 20px; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.ok .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(43,166,64,.2); }
  .status.bad .dot { background: var(--err); }
  .notice { margin: 12px 16px 0; padding: 10px 12px; border-radius: 10px; font-size: 12px; background: rgba(204,0,0,.1); color: var(--err); display: none; }
  .notice.show { display: block; }
  .grab {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: calc(100% - 32px); height: 38px; margin: 14px 16px 2px; border: 0; border-radius: 19px;
    background: var(--text); color: var(--bg); font: 600 13px "Segoe UI", Roboto, sans-serif; cursor: pointer;
  }
  .grab:hover { opacity: .88; }
  .grab:disabled { opacity: .4; cursor: default; }
  .grab svg { width: 18px; height: 18px; }
  .bar-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 4px; }
  h2 { font-size: 11px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); margin: 0; }
  .link { border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  .link:hover { background: var(--card); color: var(--text); }
  .jobs { padding: 0 16px 12px; max-height: 380px; overflow-y: auto; }
  .job { display: flex; gap: 12px; align-items: center; padding: 10px 8px; margin: 0 -8px; border-bottom: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .job:hover { background: var(--card); }
  .job:last-child { border-bottom: 0; }
  .kind { width: 36px; height: 36px; border-radius: 10px; background: var(--card); display: grid; place-items: center; }
  .kind svg { width: 18px; height: 18px; }
  .info { flex: 1; min-width: 0; }
  .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta .done { color: var(--ok); } .meta .error, .meta .cancelled { color: var(--err); }
  .progress { height: 4px; background: var(--card); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
  .job.done .progress i { background: var(--ok); }
  .job.cancelled .progress, .job.error .progress { display: none; }
  .cancel {
    width: 30px; height: 30px; border: 0; border-radius: 50%; background: none; color: var(--muted);
    cursor: pointer; display: grid; place-items: center;
  }
  .cancel:hover { background: var(--hover); color: var(--err); }
  .cancel svg { width: 18px; height: 18px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 0 20px; }
  .empty svg { width: 32px; height: 32px; opacity: .5; display: block; margin: 0 auto 8px; }
  footer { padding: 10px 16px 14px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
  .setting { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer; }
  .seg { display: inline-flex; flex: none; background: var(--card); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: none; color: var(--muted); font: 600 12px "Segoe UI", Roboto, sans-serif; min-width: 26px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .seg button.on { background: var(--text); color: var(--bg); }
  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; border-radius: 10px; background: var(--hover); transition: background .15s; }
  .switch span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(16px); }
</style></head>
<body>
  <header>
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 15.6 7.4 11l1.4-1.4 2.2 2.2V4h2v7.8l2.2-2.2 1.4 1.4L12 15.6ZM5 20v-2h14v2H5Z"/></svg></div>
    <h1>YT Downloader</h1>
    <div id="status" class="status"><span class="dot"></span><span id="statusText">Checking…</span></div>
  </header>
  <div id="notice" class="notice"></div>
  <button id="grab" class="grab">
    <svg viewBox="0 0 24 24"><path d="M12 15.6 7.4 11l1.4-1.4 2.2 2.2V4h2v7.8l2.2-2.2 1.4 1.4L12 15.6ZM5 20v-2h14v2H5Z"/></svg>
    <span>Download from this tab</span></button>
  <div class="bar-row"><h2>Downloads</h2><button class="link" id="clear">Clear finished</button></div>
  <div class="jobs" id="jobs"></div>
  <label class="setting"><span>Use my YouTube login<br><small style="color:var(--muted)">Avoids "Sign in to confirm you're not a bot"</small></span>
    <span class="switch"><input type="checkbox" id="useCookies"><span></span></span></label>
  <div class="setting"><span>Playlist songs at once<br><small style="color:var(--muted)">Higher is faster; too high may trigger bot checks</small></span>
    <span class="seg" id="parallel"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="6">6</button></span></div>
  <label class="setting"><span>Play YouTube videos without ads<br><small style="color:var(--muted)">When an ad starts, plays the video directly instead (up to 1080p)</small></span>
    <span class="switch"><input type="checkbox" id="cleanPlayer"><span></span></span></label>
  <label class="setting"><span>Download icons on thumbnails</span>
    <span class="switch"><input type="checkbox" id="thumbIcons"><span></span></span></label>
  <footer id="footer">Click Download on any YouTube video, song or playlist.</footer>
  <script src="popup.js"></script>
</body></html>
